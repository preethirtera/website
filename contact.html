<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get in Touch — Preethi Tera</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Montserrat', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: { cream: '#FFEDA1', espresso: '#372020', corn: '#9FBFFF', poppy: '#FF2E2E' },
      },
    },
  };
</script>
</head>
<body class="bg-cream">

  <!-- ============ GLOBAL NAV BAR ============ -->
  <header class="fixed inset-x-0 top-0 z-50 flex h-16 items-center justify-end bg-espresso px-8 sm:px-12 shadow-[0_4px_12px_rgba(55,32,32,0.22)]">
    <nav class="flex gap-6 sm:gap-9 text-[12px] font-semibold uppercase tracking-[0.18em]">
      <a href="index.html?home" class="text-cream/70 transition-colors hover:text-cream">Home</a>
      <a href="about.html" class="text-cream/70 transition-colors hover:text-cream">About</a>
      <a href="coming-soon.html" class="text-cream/70 transition-colors hover:text-cream">Work</a>
      <a href="coming-soon.html" class="text-cream/70 transition-colors hover:text-cream">Play</a>
      <a href="contact.html" class="text-cream transition-colors hover:text-cream">Contact</a>
    </nav>
  </header>

  <!-- ============ SPLIT LAYOUT ============ -->
  <main class="flex min-h-screen w-full items-center justify-center bg-cream px-8 sm:px-12 pt-24 pb-16 font-sans text-espresso">
    <div class="grid w-full max-w-5xl grid-cols-1 md:grid-cols-2 items-center gap-12 md:gap-16">

    <!-- LEFT — 3D TYPOGRAPHY -->
    <section class="flex items-center md:justify-start">
      <h1 class="font-black uppercase leading-[0.95] tracking-tight text-[15vw] md:text-[6vw]
                 [text-shadow:4px_4px_0px_#9FBFFF,8px_8px_0px_#372020]">
        Let&rsquo;s<br />Get In<br />Touch
      </h1>
    </section>

    <!-- RIGHT — 3D FORM CARD -->
    <section class="flex items-center justify-center md:justify-end">
      <form onsubmit="return false;"
            class="w-full max-w-md rounded-[3rem] border-[3px] border-espresso bg-cream p-10 sm:p-12 shadow-[12px_12px_0px_0px_#372020]">

        <!-- Name -->
        <label for="name" class="sr-only">Name</label>
        <input id="name" type="text" placeholder="Name" autocomplete="name"
               class="mb-5 w-full rounded-full border-2 border-espresso bg-transparent px-6 py-4 text-base text-espresso shadow-inner outline-none transition-colors placeholder:text-espresso/50 focus:border-poppy focus:bg-corn/15" />

        <!-- Email -->
        <label for="email" class="sr-only">Email</label>
        <input id="email" type="email" placeholder="Email" autocomplete="email"
               class="mb-5 w-full rounded-full border-2 border-espresso bg-transparent px-6 py-4 text-base text-espresso shadow-inner outline-none transition-colors placeholder:text-espresso/50 focus:border-poppy focus:bg-corn/15" />

        <!-- Message -->
        <label for="message" class="sr-only">Message</label>
        <textarea id="message" rows="4" placeholder="Message"
                  class="mb-7 w-full resize-none rounded-3xl border-2 border-espresso bg-transparent px-6 py-4 text-base text-espresso shadow-inner outline-none transition-colors placeholder:text-espresso/50 focus:border-poppy focus:bg-corn/15"></textarea>

        <!-- 3D Pill Submit -->
        <button type="submit"
                class="flex w-full items-center justify-center gap-2 rounded-full border-2 border-espresso bg-corn px-8 py-4 text-sm font-bold uppercase tracking-[0.2em] text-espresso shadow-[4px_4px_0px_0px_#372020] transition-all duration-150 hover:translate-x-1 hover:translate-y-1 hover:shadow-[0px_0px_0px_0px_#372020] active:translate-x-1 active:translate-y-1 active:shadow-[0px_0px_0px_0px_#372020]">
          Submit <span aria-hidden="true">&rarr;</span>
        </button>
      </form>
    </section>

    </div>
  </main>

</body>
</html>
