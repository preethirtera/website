  <script>
    // premium depth: each card scales back a touch as the next one stacks over it
    (function () {
      const cards = Array.from(document.querySelectorAll('.card'));
      function update() {
        for (let i = 0; i < cards.length; i++) {
          const card = cards[i], next = cards[i + 1];
          if (!next) { card.style.transform = 'scale(1)'; continue; }
          const dist = next.getBoundingClientRect().top - card.getBoundingClientRect().top;
          const start = card.offsetHeight, end = 28;
          let p = (start - dist) / (start - end);
          p = Math.max(0, Math.min(1, p));
          card.style.transform = 'scale(' + (1 - p * 0.06).toFixed(4) + ')';
        }
      }
      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update);
      update();
    })();
  </script>
